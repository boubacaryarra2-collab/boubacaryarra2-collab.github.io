<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2 Collab - Boutique</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#000;color:#fff;padding:15px;text-align:center;position:sticky;top:0}
header h1{font-size:24px}
.panier-btn{position:absolute;right:15px;top:15px;background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:20px;cursor:pointer}
.container{max-width:1200px;margin:20px auto;padding:10px}
.produits{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.carte{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-align:center}
.carte img{width:100%;height:250px;object-fit:cover;border-radius:8px;background:#ddd}
.carte h3{margin:10px 0;font-size:16px}
.prix{color:#e63946;font-weight:bold;font-size:18px;margin:5px 0}
.desc{font-size:12px;color:#666;margin:5px 0}
.couleurs{font-size:12px;color:#333;margin:5px 0}
.btn{background:#000;color:#fff;border:none;padding:10px;width:100%;border-radius:5px;cursor:pointer;margin-top:5px}
.btn:hover{background:#333}
.panier{position:fixed;right:-400px;top:0;width:350px;height:100%;background:#fff;box-shadow:-2px 0 5px rgba(0,0,0,0.2);transition:0.3s;padding:20px;overflow-y:auto}
.panier.open{right:0}
.item-panier{display:flex;justify-content:space-between;margin:10px 0;border-bottom:1px solid #eee;padding-bottom:10px}
.total{font-weight:bold;font-size:20px;margin:20px 0}
.whatsapp{background:#25D366}
</style>
</head>
<body>

<header>
  <h1>A2 COLLAB</h1>
  <button class="panier-btn" onclick="togglePanier()">Panier (<span id="compteur">0</span>)</button>
</header>

<div class="container">
  <div class="produits" id="listeProduits"></div>
</div>

<div class="panier" id="panier">
  <h2>Mon Panier</h2>
  <div id="contenuPanier"></div>
  <div class="total">Total: <span id="total">0</span> FCFA</div>
  <button class="btn whatsapp" onclick="envoyerWhatsApp()">Finaliser sur WhatsApp</button>
  <button class="btn" onclick="togglePanier()">Fermer</button>
</div>

<script>
const numeroWhatsApp = "22372039675"; // CHANGE ÇA PAR TON NUMERO

const produits = [
  {nom:"Crocs Spiderman Noir", prix:22000, img:"https://via.placeholder.com/250/000/fff?text=Crocs+Noir", desc:"Pointures 40-45. Confort max", couleurs:"Noir"},
  {nom:"Ensemble Lacoste Blanc", prix:35000, img:"https://via.placeholder.com/250/fff/000?text=Lacoste+Blanc", desc:"T-shirt + Short. Coton premium", couleurs:"Blanc"},
  {nom:"Ensemble Lacoste Bleu Marine", prix:35000, img:"https://via.placeholder.com/250/001f3f/fff?text=Lacoste+Bleu", desc:"T-shirt + Short. Coton premium", couleurs:"Bleu Marine"},
  {nom:"Survêtement Nike Vert", prix:35000, img:"https://via.placeholder.com/250/2ecc40/fff?text=Nike+Vert", desc:"Haut + Pantalon. Coupe slim", couleurs:"Vert"},
  {nom:"Crocs Spiderman Rouge", prix:22000, img:"https://via.placeholder.com/250/ff4136/fff?text=Crocs+Rouge", desc:"Pointures 40-45. Léger et solide", couleurs:"Rouge"},
  {nom:"Maillot Real Madrid Rose", prix:7000, img:"https://via.placeholder.com/250/ff69b4/fff?text=Real+Rose", desc:"Version fan 2025. Flocage inclus", couleurs:"Rose"},
  {nom:"Maillot Bayern Munich Blanc", prix:7000, img:"https://via.placeholder.com/250/fff/000?text=Bayern+Blanc", desc:"Version fan 2025. Flocage inclus", couleurs:"Blanc"},
  {nom:"T-shirt Adidas 3 Bandes", prix:9000, img:"5b3fc4c5-fb75-4c5c-8a87-0a61657b6a8a.jpeg", desc:"T-shirt coton. Coupe oversize", couleurs:"Blanc / Noir"},
];

let panier = [];

function afficherProduits(){
  const liste = document.getElementById('listeProduits');
  liste.innerHTML = '';
  produits.forEach((p, i) => {
    liste.innerHTML += `
      <div class="carte">
        <img src="${p.img}">
        <h3>${p.nom}</h3>
        <div class="prix">${p.prix.toLocaleString()} FCFA</div>
        <div class="desc">${p.desc}</div>
        <div class="couleurs">Couleur: ${p.couleurs}</div>
        <button class="btn" onclick="ajouterPanier(${i})">Ajouter au panier</button>
      </div>
    `;
  });
}

function ajouterPanier(i){
  panier.push(produits[i]);
  majPanier();
  alert(produits[i].nom + " ajouté au panier!");
}

function majPanier(){
  document.getElementById('compteur').innerText = panier.length;
  let html = '';
  let total = 0;
  panier.forEach((p) => {
    html += `<div class="item-panier"><span>${p.nom}</span><span>${p.prix} FCFA</span></div>`;
    total += p.prix;
  });
  document.getElementById('contenuPanier').innerHTML = html || '<p>Panier vide</p>';
  document.getElementById('total').innerText = total.toLocaleString();
}

function togglePanier(){
  document.getElementById('panier').classList.toggle('open');
}

function envoyerWhatsApp(){
  if(panier.length === 0){alert('Panier vide');return}
  let message = "Bonjour A2 Collab, je veux commander:%0A%0A";
  panier.forEach(p => { message += `- ${p.nom} : ${p.prix} FCFA%0A` });
  message += `%0ATotal: ${document.getElementById('total').innerText} FCFA`;
  window.open(`https://wa.me/${numeroWhatsApp}?text=${message}`);
}

afficherProduits();
</script>

</body>
</html>
