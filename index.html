<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFINITY DRIP STORE by Bocar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont}
body{background:#F5F2EB;padding-bottom:80px}
.header{position:sticky;top:10px;margin:10px 15px;background:#fff;border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.logo-box{display:flex;align-items:center;gap:10px}
.logo{ background:#D4A574;color:#000;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family: 'Georgia', serif;}
.hero{background:#000;color:#fff;padding:80px 20px;text-align:center}
.hero small{color:#D4A574;letter-spacing:3px;font-size:11px;font-weight:600}
.hero h1{font-size:32px;margin:20px 0;line-height:1.2;font-weight:700;font-family: 'Georgia', serif;}
.hero h1 span{color:#D4A574}
.hero p{color:#aaa;font-size:15px;margin-bottom:30px;max-width:400px;margin:0 auto 30px auto}
.btn-main{background:#D4A574;color:#000;border:none;padding:16px 35px;border-radius:30px;font-weight:700;font-size:15px}
.container{padding:30px 15px;max-width:600px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden}
.card img{width:100%;
